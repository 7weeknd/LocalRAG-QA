<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LocalRAG-QA · 本地私有化 RAG 知识库问答系统</title>
<style>
  :root {
    --bg1: #eef2ff;
    --bg2: #fdf2f8;
    --brand: #4f46e5;
    --brand2: #7c3aed;
    --ink: #1e293b;
    --muted: #64748b;
    --card: #ffffff;
    --user-bubble: linear-gradient(135deg, #4f46e5, #7c3aed);
    --hit: #16a34a;
    --miss: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; color: var(--ink);
  }
  .app {
    width: 100%; max-width: 760px; display: flex; flex-direction: column;
    height: calc(100vh - 48px); min-height: 520px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; background: var(--card);
    border-radius: 18px 18px 0 0; box-shadow: 0 10px 30px rgba(79,70,229,.12);
    border-bottom: 1px solid #eef0f6;
  }
  header .title { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 20px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: #eef2ff; color: var(--brand);
  }
  .chat {
    flex: 1; overflow-y: auto; padding: 22px;
    background: #fafbfe; border-left: 1px solid #eef0f6; border-right: 1px solid #eef0f6;
  }
  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 12px 16px; border-radius: 16px;
    font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.ai .bubble {
    background: var(--card); border: 1px solid #e9ecf3;
    border-bottom-left-radius: 4px; box-shadow: 0 4px 14px rgba(15,23,42,.05);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tag {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: #f1f5f9; color: var(--muted); font-weight: 500;
  }
  .tag.hit { background: #dcfce7; color: var(--hit); }
  .tag.miss { background: #fee2e2; color: var(--miss); }
  .typing { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: blink 1s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 14px; }
  .empty .big { font-size: 42px; margin-bottom: 12px; }
  .inputbar {
    display: flex; gap: 10px; padding: 16px 18px;
    background: var(--card); border-radius: 0 0 18px 18px;
    box-shadow: 0 -6px 20px rgba(15,23,42,.06); border: 1px solid #eef0f6; border-top: 0;
  }
  input {
    flex: 1; padding: 13px 16px; border: 1px solid #dbe0ea; border-radius: 14px;
    font-size: 15px; outline: none; transition: border .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  button {
    padding: 0 22px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff;
    font-size: 15px; font-weight: 600; transition: opacity .15s, transform .05s;
  }
  button:hover { opacity: .9; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="logo">AI</div>
        <div>
          <h1>LocalRAG-QA</h1>
          <div class="sub">本地大模型 + 私有知识库</div>
        </div>
      </div>
      <span class="badge" id="modelBadge">加载中…</span>
    </header>

    <div class="chat" id="chat">
      <div class="empty">
        <div class="big">💬</div>
        输入问题开始问答，例如：<br>「七天无理由退货运费谁出」
      </div>
    </div>

    <div class="inputbar">
      <input id="q" placeholder="输入你的问题…" autocomplete="off" />
      <button id="send">发送</button>
    </div>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('q');
  const send = document.getElementById('send');
  const badge = document.getElementById('modelBadge');

  async function ask() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    send.disabled = true;

    addBubble('user', q);
    const typing = addTyping();

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const d = await res.json();
      typing.remove();
      addAnswer(d);
    } catch (e) {
      typing.remove();
      addBubble('ai', '请求失败：' + e.message + '\n请确认服务正在运行。');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  function addBubble(role, text) {
    const empty = chat.querySelector('.empty');
    if (empty) empty.remove();
    const m = document.createElement('div');
    m.className = 'msg ' + role;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    m.appendChild(b);
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  function addTyping() {
    const m = document.createElement('div');
    m.className = 'msg ai';
    m.innerHTML = '<div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
    return m;
  }

  function addAnswer(d) {
    const m = document.createElement('div');
    m.className = 'msg ai';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = d.answer || '(空回答)';
    m.appendChild(b);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const hit = document.createElement('span');
    hit.className = 'tag ' + (d.hit ? 'hit' : 'miss');
    hit.textContent = d.hit ? '✅ 命中知识库' : '⚠️ 知识库外';
    meta.appendChild(hit);

    if (d.citations && d.citations.length) {
      d.citations.forEach(c => {
        const t = document.createElement('span');
        t.className = 'tag';
        t.textContent = '📄 ' + c.title;
        meta.appendChild(t);
      });
    }
    const lat = document.createElement('span');
    lat.className = 'tag';
    lat.textContent = '⚡ ' + (d.latency_ms || 0) + ' ms';
    meta.appendChild(lat);
    m.appendChild(meta);

    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }

  send.addEventListener('click', ask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

  // 顶部展示当前接入的模型
  fetch('/health').then(r => r.json()).catch(() => ({}))
    .then(h => { badge.textContent = (h && h.model ? h.model : '已连接'); });
</script>
</body>
</html>
